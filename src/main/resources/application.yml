spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 15s #durée max pour terminer le traitement des req en cours avant arrêt
  r2dbc:
    username: user
    password: password
    url: r2dbc:postgresql://localhost:5432/polardb_order
    pool:
      max-create-connection-time: 2s # temps max pour obtenir une connexion depuis le pool
      initial-size: 5
      max-size: 10 # défaut
  flyway:
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    url: jdbc:postgresql://localhost:5432/polardb_order
    
  cloud:
    function:
      definition: consumeOrderDispatchedMessages #déclaration de la prise en charge de la fonction par SCF
    stream:
      bindings:
        consumeOrderDispatchedMessages-in-0: #config de l'input binding - nom dérivé de la fonction SCF associée
          destination: order-dispatched #l'exchange dans lequel les messages à destination d'order-services sont envoyés par dispatcher-service
          group: ${spring.application.name} # queue :order-dispatched.order-service - créé lors du déploiement du consommateur order-service
        #config du binding créé au démarrage (par le binder SCS)
        acceptOrder-out-0:
          destination: order-accepted #exchange dans lequel OrderService publie les messages notifiant de l'acceptation de la commande
      rabbit: #config spécifique du binding pour RabbitMQ
        bindings:
          acceptOrder-out-0:
            producer:
              transacted: true #intégration du binding dans la transaction
  #config de l'intégration avec RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password
    connection-timeout: 5s

  security:
    oauth2:
      resourceserver: #catalog-service est un resource server qui communique avec Keycloak pour obtenir une clé afin de valider la signature de l'access token reçu en entête de requête entrante
        jwt: # il faut explicité le format JWT de l'access token car OAuth2 n'impose pas de format
          issuer-uri: http://localhost:8080/realms/PolarBookshop #point de terminaison Keycloak - base pour accéder au JWK set

info:
  system: Polar Bookshop

#activation du Ep /actuator/refresh à traver http
management:
  endpoints:
    web:
      exposure:
        include: refresh, health, prometheus, flyway, info, heapdump
  endpoint:
    health:
      show-details: always
      show-components: always
      #activation des EP /actuator/health/liveness et readiness
      probes:
        enabled: true
  #tag des métriques exposées avec une clé/valeur application=nom app
  metrics:
    tags:
      applications: ${spring.application.name}
  info:
    env:
      enabled: true
    os:
      enabled: true
    java:
      enabled: true

server:
  port: 9002
  shutdown: graceful
  netty:
    connection-timeout: 2s
    idle-timeout: 15s
polar:
  catalog-service-uri: "http://localhost:9001"
  #externalisation des valeurs de configuration de la résilience Reactor
  timeout: 3
  max-retry: 3
  retry-backoff: 100
#customisation des infos de logging : ajout d'infos après le log level (%5p)
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
